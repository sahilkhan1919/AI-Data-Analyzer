services:
  - type: web
    name: csv-dashboard-backend
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic -c alembic.ini upgrade head
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    disk:
      name: csv-dashboard-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: FLASK_ENV
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "None"
      - key: UPLOAD_FOLDER
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: DATASET_CLEANUP_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URI
        sync: false
      - key: LOGIN_RATE_LIMIT_ATTEMPTS
        value: 5
      - key: LOGIN_RATE_LIMIT_WINDOW_SECONDS
        value: 900
