services:
  - type: web
    name: csv-dashboard-backend
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic -c alembic.ini upgrade head
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: FLASK_ENV
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "None"
      - key: STORAGE_BACKEND
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_REGION
        value: auto
      - key: R2_PREFIX
        value: csv-dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: DATASET_CLEANUP_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URI
        sync: false
      - key: LOGIN_RATE_LIMIT_ATTEMPTS
        value: 5
      - key: LOGIN_RATE_LIMIT_WINDOW_SECONDS
        value: 900
